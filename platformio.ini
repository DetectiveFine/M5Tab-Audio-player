; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32p4_pioarduino]
platform = https://github.com/pioarduino/platform-espressif32.git#54.03.21
upload_speed = 1500000
monitor_speed = 115200
build_type = release
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
extra_scripts =
    pre:scripts/exclude_lvgl_helium.py
    pre:scripts/filter_esp8266audio.py
    pre:scripts/link_esp_audio_effects.py
build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DLV_CONF_SKIP
    -DLV_DEF_REFR_PERIOD=16
    -DLV_MEM_SIZE=262144U
    -DLV_DRAW_BUF_ALIGN=64
    -DLV_USE_SYSMON=1
    -DLV_USE_PERF_MONITOR=0
    -DLV_USE_PERF_MONITOR_POS=LV_ALIGN_TOP_RIGHT
    -DLV_SYSMON_REFR_PERIOD_DEF=1000
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
lib_deps =
    https://github.com/M5Stack/M5Unified.git
    https://github.com/M5Stack/M5GFX.git
    https://github.com/earlephilhower/ESP8266Audio.git#2.4.2
    lvgl/lvgl @ 9.5.0
